name: Daily Stock Screener

on:
  schedule:
    # Taiwan market daily refresh, Monday-Friday, 15:10 Asia/Taipei.
    - cron: "10 7 * * 1-5"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Run even on weekends/non-trading days"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

# 同一時間只允許一個 screener 在跑，避免前一天卡住的 job 與今天的互相搶 push。
concurrency:
  group: daily-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    # 硬上限 5 小時：超過就明確失敗並寄通知，不再默默燒滿 GitHub 的 6 小時才被砍。
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        # v4 使用 Node 20（已淘汰），升到 v5 走 Node 24
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        # v5 使用 Node 20（已淘汰），升到 v6 走 Node 24
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        timeout-minutes: 15
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run screener
        # 抓取階段自己的上限，留 30 分鐘給後面的 commit / publish 步驟
        timeout-minutes: 270
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
          SCREENER_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force_run || 'false' }}
          # 不緩衝 stdout：讓 Actions log 每行帶真實時間戳，才能定位慢的階段
          PYTHONUNBUFFERED: "1"
        run: python scripts/run_screener.py

      - name: Analyze signal outcomes
        timeout-minutes: 20
        run: python scripts/analyze_signal_outcomes.py --min-samples 3

      - name: Commit generated results
        timeout-minutes: 10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/results.json frontend/data/history.json frontend/data/signal_backtest.json
          git add frontend/data/chip_history.csv 2>/dev/null || true
          git add frontend/data/sector_history.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update screener results"
            git pull --rebase origin main
            git push
          fi

      - name: Publish frontend to GitHub Pages
        timeout-minutes: 10
        run: |
          git pull --rebase origin main
          git fetch origin gh-pages:gh-pages
          git worktree add ../pages gh-pages
          cp frontend/index.html ../pages/index.html
          cp frontend/app.js ../pages/app.js
          cp frontend/styles.css ../pages/styles.css
          cp frontend/.nojekyll ../pages/.nojekyll
          mkdir -p ../pages/data
          cp frontend/data/results.json ../pages/data/results.json
          cp frontend/data/history.json ../pages/data/history.json
          cp frontend/data/signal_backtest.json ../pages/data/signal_backtest.json
          if [ -f frontend/data/sector_history.json ]; then cp frontend/data/sector_history.json ../pages/data/sector_history.json; fi
          cd ../pages
          git add index.html app.js styles.css .nojekyll data/results.json data/history.json data/signal_backtest.json
          git add data/sector_history.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update published screener site"
            git pull --rebase origin gh-pages
            git push origin gh-pages
          fi
